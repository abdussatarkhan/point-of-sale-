[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "point_of_sale"
version = "1.0.0"
description = "A full-stack Flask + MySQL point-of-sale system with barcode/manual register modes, split-tender payments, discounts, dark/light theming, admin analytics dashboard, and role-based user management. Built for small retail counters."
readme = "README.md"
authors = [
    { name = "Abdussatar", email = "satarabdus692@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
